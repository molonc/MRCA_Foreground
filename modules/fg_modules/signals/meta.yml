name: signals
description: >
  Assigns alleles to copy number bins and performs haplotype phasing using
  the SIGNALS package (https://github.com/shahcompbio/signals), producing a
  haplotype-specific copy number (hscn) table per library.
script: signals.R
input:
  - sample_id: Tracking id from the samplesheet; names the results subdirectory
  - reads: Filtered hmmcopy reads
  - alleles: Filtered allele count file
  - metrics: Filtered hmmcopy metrics
  - phasing_object: Pre-computed SIGNALS phasing object (or a dummy empty file if params.phasing_object is unset)
output:
  - master: tuple of (sample_id, reads, alleles, metrics, hscn)
