# Conda environment for MEDICC2 tree-building steps (medicc2, jitter_correct,
# foreground, preprocess_medicc2 modules).
#
# NOTE: this file previously pinned exact osx64 conda builds (e.g.
# `libblas=3.9.0=22_osx64_openblas`) copied from a macOS development machine, which
# cannot be solved on Linux at all. Package versions below are pinned; build hashes
# are intentionally left unpinned so conda/mamba can solve a build for the host
# platform. Verify with `mamba env create -f medicc2.yaml` on the target system.
name: medicc2
channels:
  - bioconda
  - conda-forge
dependencies:
  - python=3.10
  - medicc2=1.1.2
  - pip
  - pip:
      - scgenome==0.0.19
